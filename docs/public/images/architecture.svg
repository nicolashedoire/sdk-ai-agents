<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="title">
<title id="title">Architecture of the SDK: governed and cognitive agents, controllers, governance, tools and the event store</title>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4F46E5"/><stop offset="0.55" stop-color="#7C3AED"/><stop offset="1" stop-color="#C026D3"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#0284C7"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
  </filter>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect x="40" y="30" width="640" height="56" rx="14" fill="#1E293B"/><text x="58" y="58" font-size="17" font-weight="700" fill="#fff">Your application</text>
<text x="236" y="63" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#94A3B8">agent.run() · agent.think() · sdk.decisions.choose()</text>
<rect x="40" y="110" width="310" height="120" rx="14" fill="#4F46E5" filter="url(#shadow)"/><text x="58" y="138" font-size="16" font-weight="700" fill="#fff">Governed agents</text><text x="58" y="162" font-size="13" fill="#fff" fill-opacity="0.88">LLM proposes intentions</text><text x="58" y="181" font-size="13" fill="#fff" fill-opacity="0.88">never executes anything itself</text><text x="58" y="200" font-size="13" fill="#fff" fill-opacity="0.88">the classic tool-calling loop</text>
<rect x="370" y="110" width="310" height="120" rx="14" fill="#7C3AED" filter="url(#shadow)"/><text x="388" y="138" font-size="16" font-weight="700" fill="#fff">Cognitive agents</text><text x="388" y="162" font-size="13" fill="#fff" fill-opacity="0.88">explicit mental state</text><text x="388" y="181" font-size="13" fill="#fff" fill-opacity="0.88">10 operations, one per step</text><text x="388" y="200" font-size="13" fill="#fff" fill-opacity="0.88">thinker profile + feedback</text>
<rect x="40" y="250" width="310" height="110" rx="14" fill="#0284C7" filter="url(#shadow)"/><text x="58" y="278" font-size="16" font-weight="700" fill="#fff">LLM providers</text><text x="58" y="302" font-size="13" fill="#fff" fill-opacity="0.88">OpenAI · Anthropic · your provider</text><text x="58" y="321" font-size="13" fill="#fff" fill-opacity="0.88">retries + fallback per provider</text>
<rect x="370" y="250" width="310" height="110" rx="14" fill="#C026D3" filter="url(#shadow)"/><text x="388" y="278" font-size="16" font-weight="700" fill="#fff">Controller</text><text x="388" y="302" font-size="13" fill="#fff" fill-opacity="0.88">heuristic  ·  Jev typed decisions</text><text x="388" y="321" font-size="13" fill="#fff" fill-opacity="0.88">picks the next operation</text>
<rect x="40" y="380" width="640" height="76" rx="14" fill="#E11D48" filter="url(#shadow)"/><text x="58" y="408" font-size="16" font-weight="700" fill="#fff">Governance</text><text x="58" y="432" font-size="13" fill="#fff" fill-opacity="0.88">policies  ·  approvals  ·  budgets  ·  allowlists  ·  retries</text>
<rect x="40" y="476" width="310" height="110" rx="14" fill="#D97706" filter="url(#shadow)"/><text x="58" y="504" font-size="16" font-weight="700" fill="#fff">Action engine</text><text x="58" y="528" font-size="13" fill="#fff" fill-opacity="0.88">executes governed tool calls</text><text x="58" y="547" font-size="13" fill="#fff" fill-opacity="0.88">per-tool retry policy</text>
<rect x="370" y="476" width="310" height="110" rx="14" fill="#0D9488" filter="url(#shadow)"/><text x="388" y="504" font-size="16" font-weight="700" fill="#fff">Tools</text><text x="388" y="528" font-size="13" fill="#fff" fill-opacity="0.88">local TypeScript tools</text><text x="388" y="547" font-size="13" fill="#fff" fill-opacity="0.88">any MCP server (imported)</text>
<rect x="720" y="30" width="240" height="556" rx="18" fill="#0F172A" filter="url(#shadow)"/>
<rect x="720" y="30" width="240" height="556" rx="18" fill="none" stroke="#334155"/>
<text x="840" y="66" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">Event store</text>
<text x="840" y="88" text-anchor="middle" font-size="12.5" fill="#94A3B8">file · SQLite · PostgreSQL</text>
<rect x="740" y="116" width="200" height="46" rx="12" fill="#4F46E5"/>
<text x="840" y="144" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">Replay without LLM</text>
<rect x="740" y="180" width="200" height="46" rx="12" fill="#7C3AED"/>
<text x="840" y="208" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">Traces &amp; reasoning graph</text>
<rect x="740" y="244" width="200" height="46" rx="12" fill="#C026D3"/>
<text x="840" y="272" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">Mental state rebuild</text>
<rect x="740" y="308" width="200" height="46" rx="12" fill="#059669"/>
<text x="840" y="336" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">Run costs (USD)</text>
<rect x="740" y="372" width="200" height="46" rx="12" fill="#E11D48"/>
<text x="840" y="400" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">Incidents → email / webhook</text>
<rect x="740" y="436" width="200" height="46" rx="12" fill="#0284C7"/>
<text x="840" y="464" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">Controller dataset</text>
<rect x="740" y="500" width="200" height="46" rx="12" fill="#0D9488"/>
<text x="840" y="528" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">MCP server (expose)</text>
<line x1="195" y1="86" x2="195" y2="106" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="525" y1="86" x2="525" y2="106" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="525" y1="230" x2="525" y2="246" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="195" y1="230" x2="195" y2="246" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="372" y1="222" x2="344" y2="250" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="360" y1="456" x2="360" y2="472" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="350" y1="531" x2="366" y2="531" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="684" y1="300" x2="716" y2="300" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<line x1="684" y1="418" x2="716" y2="418" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="700" y="612" text-anchor="middle" font-size="13" font-weight="500" fill="#7C8599">every step is an event — nothing happens off the record</text>
</g>
</svg>
