<path d="M78.6 284.0 A222 222 0 0 1 93.5 218.4" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M174.5 116.9 A222 222 0 0 1 235.1 87.7" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>
