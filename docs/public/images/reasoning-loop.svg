<circle cx="300" cy="300" r="128" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="10"/>
<text x="300" y="262" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#fff" fill-opacity="0.8">EXPLICIT</text>
<text x="300" y="290" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">Mental state</text>
<text x="300" y="320" text-anchor="middle" font-size="13.5" fill="#fff" fill-opacity="0.9">facts · assumptions</text>
