<rect x="132.2" y="111.9" width="124" height="40" rx="20.0" fill="#0284C7" filter="url(#shadow)"/><text x="194.2" y="136.9" text-anchor="middle" font-size="14.5" font-weight="600" fill="#fff">Decide</text>
