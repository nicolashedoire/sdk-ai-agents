<path d="M120.9 210.6 A282 282 0 0 1 144.0 178.7" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M254.4 98.5 A282 282 0 0 1 291.8 86.4" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="360" cy="360" r="128" fill="url(#brand)" filter="url(#shadow)"/>
<circle cx="360" cy="360" r="128" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="10"/>
<text x="360" y="322" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#fff" fill-opacity="0.8">EXPLICIT</text>
<text x="360" y="350" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">Mental state</text>
<text x="360" y="380" text-anchor="middle" font-size="13.5" fill="#fff" fill-opacity="0.9">observations · facts</text>
<text x="360" y="400" text-anchor="middle" font-size="13.5" fill="#fff" fill-opacity="0.9">hypotheses · predictions</text>
<text x="360" y="420" text-anchor="middle" font-size="13.5" fill="#fff" fill-opacity="0.9">contradictions · confidence</text>
<rect x="298.0" y="58.0" width="124" height="40" rx="20.0" fill="#4F46E5" filter="url(#shadow)"/><text x="360.0" y="83.1" text-anchor="middle" font-size="14.5" font-weight="600" fill="#fff">Represent</text>
<rect x="463.8" y="111.9" width="124" height="40" rx="20.0" fill="#7C3AED" filter="url(#shadow)"/><text x="525.8" y="136.9" text-anchor="middle" font-size="14.5" font-weight="600" fill="#fff">Compare obs.</text>
