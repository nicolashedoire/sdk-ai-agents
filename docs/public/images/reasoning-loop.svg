<rect x="409.6" y="140.6" width="128" height="42" rx="21.0" fill="#7C3AED" filter="url(#shadow)"/><text x="473.6" y="166.8" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Hypothesize</text>
<rect x="452.4" y="328.4" width="128" height="42" rx="21.0" fill="#C026D3" filter="url(#shadow)"/><text x="516.4" y="354.6" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Simulate</text>
<rect x="332.3" y="479.0" width="128" height="42" rx="21.0" fill="#E11D48" filter="url(#shadow)"/><text x="396.3" y="505.3" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Critique</text>
