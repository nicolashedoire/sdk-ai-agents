<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
<title id="title">SDK AI Agents logo</title>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4F46E5"/><stop offset="0.55" stop-color="#7C3AED"/><stop offset="1" stop-color="#C026D3"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#0284C7"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
  </filter>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect x="4" y="4" width="120" height="120" rx="30" fill="url(#brand)"/>
<circle cx="64" cy="64" r="15" fill="#fff"/>
<g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9">
  <line x1="64" y1="64" x2="64" y2="28"/><line x1="64" y1="64" x2="96" y2="82"/><line x1="64" y1="64" x2="32" y2="82"/>
</g>
<circle cx="64" cy="26" r="9" fill="#fff"/><circle cx="98" cy="84" r="9" fill="#fff"/><circle cx="30" cy="84" r="9" fill="#fff"/>
</g>
</svg>
