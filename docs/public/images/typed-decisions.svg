<text x="687" y="45" font-size="12" font-weight="800" letter-spacing="1.5" fill="#fff">SCORE</text>
<text x="678" y="84" font-size="15" font-weight="600" fill="#fff">How urgent is the ticket?</text>
<path d="M87 210 A78 78 0 0 1 243 210" fill="none" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
<path d="M87 210 A78 78 0 0 1 242.7 202.7" fill="none" stroke="#4F46E5" stroke-width="16" stroke-linecap="round"/>
<text x="165" y="198" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">0.97</text>
