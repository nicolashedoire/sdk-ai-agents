<text x="353" y="84" font-size="15" font-weight="600" fill="#fff">Which team should handle it?</text>
<rect x="660" y="10" width="310" height="300" rx="18" fill="#0F172A" filter="url(#shadow)"/>
<rect x="660" y="10" width="310" height="300" rx="18" fill="none" stroke="#334155"/>
