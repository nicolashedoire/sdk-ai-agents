<rect x="250" y="332" width="480" height="52" rx="26" fill="url(#brand)" filter="url(#shadow)"/>
<text x="490" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Your code decides: act · ask a human · fall back</text>
