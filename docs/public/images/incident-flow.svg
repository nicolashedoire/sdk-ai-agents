<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title">
<title id="title">Incident flow: events matched by rules become incidents delivered by email or webhook and recorded in the run</title>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4F46E5"/><stop offset="0.55" stop-color="#7C3AED"/><stop offset="1" stop-color="#C026D3"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#0284C7"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
  </filter>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect x="20" y="70" width="190" height="110" rx="14" fill="#1E293B"/><text x="38" y="98" font-size="16" font-weight="700" fill="#fff">Event stream</text><text x="38" y="122" font-size="13" fill="#fff" fill-opacity="0.88">run.failed</text><text x="38" y="141" font-size="13" fill="#fff" fill-opacity="0.88">policy.violated</text><text x="38" y="160" font-size="13" fill="#fff" fill-opacity="0.88">action.failed ...</text>
<rect x="250" y="70" width="190" height="110" rx="14" fill="#E11D48" filter="url(#shadow)"/><text x="268" y="98" font-size="16" font-weight="700" fill="#fff">Rules</text><text x="268" y="122" font-size="13" fill="#fff" fill-opacity="0.88">severity per event</text><text x="268" y="141" font-size="13" fill="#fff" fill-opacity="0.88">throttle duplicates</text>
<rect x="480" y="50" width="230" height="150" rx="14" fill="#C026D3" filter="url(#shadow)"/><text x="498" y="78" font-size="16" font-weight="700" fill="#fff">Incident</text><text x="498" y="102" font-size="13" fill="#fff" fill-opacity="0.88">title · severity · run</text><text x="498" y="121" font-size="13" fill="#fff" fill-opacity="0.88">last events timeline</text><text x="498" y="140" font-size="13" fill="#fff" fill-opacity="0.88">fingerprint</text>
<rect x="744.0" y="48.0" width="244" height="44" rx="22.0" fill="#4F46E5" filter="url(#shadow)"/><text x="866.0" y="74.9" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Email · Resend or SMTP</text>
<rect x="744.0" y="108.0" width="244" height="44" rx="22.0" fill="#0D9488" filter="url(#shadow)"/><text x="866.0" y="134.9" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Slack / Teams webhook</text>
<rect x="744.0" y="168.0" width="244" height="44" rx="22.0" fill="#D97706" filter="url(#shadow)"/><text x="866.0" y="194.9" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Your own notifier</text>
<line x1="212" y1="125" x2="246" y2="125" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="442" y1="125" x2="476" y2="125" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="712" y1="125" x2="740" y2="70" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="712" y1="125" x2="740" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="712" y1="125" x2="740" y2="190" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 595 202 C 595 262, 115 262, 115 184" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="355" y="276" text-anchor="middle" font-size="13" font-weight="500" fill="#7C8599">incident.reported (deliveries included) is appended to the run</text>
</g>
</svg>
