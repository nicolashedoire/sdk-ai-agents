<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-labelledby="title">
<title id="title">Evidence loop: observe, compare, deduce, test and revise, then a conclusion guard decides between committed, provisional and abstain</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
  </filter>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="20" y="36" text-anchor="start" font-size="12.5" font-weight="800" fill="#7C8599">BELIEVE WHAT YOU CAN JUSTIFY</text>
<rect x="20" y="90" width="170" height="92" rx="18" fill="#4F46E5" filter="url(#shadow)"/>
<text x="105" y="130" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">Observe</text>
<text x="105" y="154" text-anchor="middle" font-size="12.5" fill="#fff" fill-opacity="0.9">inputs · tools · tests</text>
<line x1="192" y1="136" x2="214" y2="136" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="216" y="90" width="170" height="92" rx="18" fill="#7C3AED" filter="url(#shadow)"/>
<text x="301" y="130" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">Compare</text>
<text x="301" y="154" text-anchor="middle" font-size="12.5" fill="#fff" fill-opacity="0.9">relations between cases</text>
<line x1="388" y1="136" x2="410" y2="136" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="412" y="90" width="170" height="92" rx="18" fill="#C026D3" filter="url(#shadow)"/>
<text x="497" y="130" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">Deduce</text>
<text x="497" y="154" text-anchor="middle" font-size="12.5" fill="#fff" fill-opacity="0.9">rule → prediction</text>
<line x1="584" y1="136" x2="606" y2="136" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="608" y="90" width="170" height="92" rx="18" fill="#D97706" filter="url(#shadow)"/>
<text x="693" y="130" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">Test</text>
<text x="693" y="154" text-anchor="middle" font-size="12.5" fill="#fff" fill-opacity="0.9">outcome evaluator</text>
<line x1="780" y1="136" x2="802" y2="136" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="804" y="90" width="170" height="92" rx="18" fill="#0D9488" filter="url(#shadow)"/>
<text x="889" y="130" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">Revise</text>
<text x="889" y="154" text-anchor="middle" font-size="12.5" fill="#fff" fill-opacity="0.9">scoped variant</text>
<path d="M 889 88 C 889 30, 497 30, 497 84" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="693" y="26" text-anchor="middle" font-size="13" font-weight="500" fill="#7C8599">refuted rule → variant with parentId</text>
<path d="M 693 184 C 693 270, 105 270, 105 188" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="399" y="276" text-anchor="middle" font-size="13" font-weight="500" fill="#7C8599">test results come back as observations</text>
<rect x="20" y="304" width="330" height="52" rx="26" fill="#1E293B"/>
<text x="185" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Conclusion guard</text>
<text x="185" y="345" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#CBD5E1">critiqued · fresh · uncontradicted · tested</text>
<line x1="352" y1="330" x2="386" y2="330" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="390" y="304" width="180" height="52" rx="26" fill="#059669"/>
<text x="480" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">committed</text>
<text x="480" y="345" text-anchor="middle" font-size="11.5" fill="#fff" fill-opacity="0.9">the answer is justified</text>
<rect x="590" y="304" width="180" height="52" rx="26" fill="#B45309"/>
<text x="680" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">provisional</text>
<text x="680" y="345" text-anchor="middle" font-size="11.5" fill="#fff" fill-opacity="0.9">says what is missing</text>
<rect x="790" y="304" width="184" height="52" rx="26" fill="#475569"/>
<text x="882" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">abstain</text>
<text x="882" y="345" text-anchor="middle" font-size="11.5" fill="#fff" fill-opacity="0.9">no answer can be justified</text>
</g>
</svg>
