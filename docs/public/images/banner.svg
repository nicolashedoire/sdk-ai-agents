<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title">
<title id="title">SDK AI Agents — governed agents that think before they act</title>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4F46E5"/><stop offset="0.55" stop-color="#7C3AED"/><stop offset="1" stop-color="#C026D3"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#0284C7"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
  </filter>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="1280" height="420" rx="28" fill="#0F172A"/>
<circle cx="1120" cy="60" r="260" fill="#7C3AED" opacity="0.28"/>
<circle cx="980" cy="420" r="220" fill="#0D9488" opacity="0.22"/>
<circle cx="120" cy="-40" r="180" fill="#4F46E5" opacity="0.3"/>
<g transform="translate(80 92) scale(0.9)"><rect x="4" y="4" width="120" height="120" rx="30" fill="url(#brand)"/>
<circle cx="64" cy="64" r="15" fill="#fff"/>
<g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9">
  <line x1="64" y1="64" x2="64" y2="28"/><line x1="64" y1="64" x2="96" y2="82"/><line x1="64" y1="64" x2="32" y2="82"/>
</g>
<circle cx="64" cy="26" r="9" fill="#fff"/><circle cx="98" cy="84" r="9" fill="#fff"/><circle cx="30" cy="84" r="9" fill="#fff"/></g>
<text x="222" y="150" font-size="58" font-weight="800" fill="#fff">SDK AI Agents</text>
<text x="84" y="236" font-size="36" font-weight="700" fill="#fff">Governed agents that <tspan fill="#C4B5FD">think</tspan> before they <tspan fill="#5EEAD4">act</tspan>.</text>
<text x="84" y="290" font-size="21" fill="#E2E8F0">Explicit reasoning · Jev typed decisions · MCP connectors · event sourcing</text>
<text x="84" y="326" font-size="21" fill="#E2E8F0">replay · costs · retries · incident alerts — in TypeScript.</text>
<rect x="84.0" y="352" width="108.4" height="34" rx="17" fill="#4F46E5"/>
<text x="138.2" y="374" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">represent</text>
<rect x="202.4" y="352" width="127.6" height="34" rx="17" fill="#7C3AED"/>
<text x="266.2" y="374" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">hypothesize</text>
<rect x="340.0" y="352" width="98.8" height="34" rx="17" fill="#C026D3"/>
<text x="389.4" y="374" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">simulate</text>
<rect x="448.8" y="352" width="98.8" height="34" rx="17" fill="#E11D48"/>
<text x="498.2" y="374" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">critique</text>
<rect x="557.6" y="352" width="79.6" height="34" rx="17" fill="#0284C7"/>
<text x="597.4" y="374" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">decide</text>
</g>
</svg>
