<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title">
<title id="title">A mental state rebuilt from events: goal, facts, unknowns, hypotheses with support, trail and decision</title>
<defs>
