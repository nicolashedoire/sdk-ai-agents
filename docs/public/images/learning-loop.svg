<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title">
<title id="title">Profile learning loop: explain topics, distill, think, give a verdict, refine; export traces as a dataset</title>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4F46E5"/><stop offset="0.55" stop-color="#7C3AED"/><stop offset="1" stop-color="#C026D3"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#0284C7"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
  </filter>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect x="20" y="60" width="170" height="92" rx="18" fill="#4F46E5" filter="url(#shadow)"/>
<text x="105" y="100" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">Explain topics</text>
<text x="105" y="124" text-anchor="middle" font-size="12.5" fill="#fff" fill-opacity="0.9">in your own words</text>
<line x1="192" y1="106" x2="214" y2="106" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="216" y="60" width="170" height="92" rx="18" fill="#7C3AED" filter="url(#shadow)"/>
<text x="301" y="100" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">Distill profile</text>
<text x="301" y="124" text-anchor="middle" font-size="12.5" fill="#fff" fill-opacity="0.9">LLM extracts your moves</text>
<line x1="388" y1="106" x2="410" y2="106" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="412" y="60" width="170" height="92" rx="18" fill="#C026D3" filter="url(#shadow)"/>
<text x="497" y="100" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">Think</text>
<text x="497" y="124" text-anchor="middle" font-size="12.5" fill="#fff" fill-opacity="0.9">agent reasons like you</text>
<line x1="584" y1="106" x2="606" y2="106" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="608" y="60" width="170" height="92" rx="18" fill="#D97706" filter="url(#shadow)"/>
<text x="693" y="100" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">Your verdict</text>
<text x="693" y="124" text-anchor="middle" font-size="12.5" fill="#fff" fill-opacity="0.9">match · partial · mismatch</text>
<line x1="780" y1="106" x2="802" y2="106" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="804" y="60" width="170" height="92" rx="18" fill="#0D9488" filter="url(#shadow)"/>
<text x="889" y="100" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">Refine</text>
<text x="889" y="124" text-anchor="middle" font-size="12.5" fill="#fff" fill-opacity="0.9">examples &amp; lessons</text>
<path d="M 889 154 C 889 236, 500 236, 453 160" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="680" y="236" text-anchor="middle" font-size="13" font-weight="500" fill="#7C8599">next run uses the refined profile</text>
<rect x="700" y="256" width="280" height="36" rx="18" fill="#1E293B"/>
<text x="840" y="279" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#E2E8F0">exportControllerDataset() → JSONL</text>
<text x="20" y="36" text-anchor="start" font-size="12.5" font-weight="800" fill="#7C8599">TEACH IT HOW YOU THINK</text>
</g>
</svg>
