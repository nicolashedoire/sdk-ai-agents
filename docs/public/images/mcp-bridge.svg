<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="title">
<title id="title">MCP in both directions: expose governed tools to MCP clients and import tools from MCP servers</title>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4F46E5"/><stop offset="0.55" stop-color="#7C3AED"/><stop offset="1" stop-color="#C026D3"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#0284C7"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
  </filter>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="150" y="30" text-anchor="middle" font-size="12.5" font-weight="800" fill="#7C8599">MCP CLIENTS</text>
<rect x="45.0" y="57.0" width="210" height="46" rx="23.0" fill="#0284C7" filter="url(#shadow)"/><text x="150.0" y="85.2" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Claude Desktop</text>
<rect x="45.0" y="127.0" width="210" height="46" rx="23.0" fill="#4F46E5" filter="url(#shadow)"/><text x="150.0" y="155.2" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">IDE assistants</text>
<rect x="45.0" y="197.0" width="210" height="46" rx="23.0" fill="#7C3AED" filter="url(#shadow)"/><text x="150.0" y="225.2" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Other agents</text>
<rect x="355" y="40" width="290" height="300" rx="22" fill="url(#brand)" filter="url(#shadow)"/>
<text x="500" y="84" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">SDK AI Agents</text>
<text x="500" y="124" text-anchor="middle" font-size="14.5" fill="#fff" fill-opacity="0.92">governed tools</text>
<text x="500" y="154" text-anchor="middle" font-size="14.5" fill="#fff" fill-opacity="0.92">policies · approvals · budgets</text>
<text x="500" y="184" text-anchor="middle" font-size="14.5" fill="#fff" fill-opacity="0.92">retries · traces · incidents</text>
<text x="500" y="214" text-anchor="middle" font-size="14.5" fill="#fff" fill-opacity="0.92">cognitive &amp; governed agents</text>
<text x="500" y="306" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#fff" fill-opacity="0.85">@sdk-ai-agents/core/mcp</text>
<text x="850" y="30" text-anchor="middle" font-size="12.5" font-weight="800" fill="#7C8599">MCP SERVERS</text>
<rect x="745.0" y="50.0" width="210" height="44" rx="22.0" fill="#0D9488" filter="url(#shadow)"/><text x="850.0" y="77.2" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">CRM</text>
<rect x="745.0" y="112.0" width="210" height="44" rx="22.0" fill="#059669" filter="url(#shadow)"/><text x="850.0" y="139.2" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Database</text>
<rect x="745.0" y="174.0" width="210" height="44" rx="22.0" fill="#D97706" filter="url(#shadow)"/><text x="850.0" y="201.2" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">GitHub</text>
<rect x="745.0" y="236.0" width="210" height="44" rx="22.0" fill="#E11D48" filter="url(#shadow)"/><text x="850.0" y="263.2" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Internal APIs</text>
<line x1="262" y1="80" x2="350" y2="80" stroke="#94A3B8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="262" y1="150" x2="350" y2="150" stroke="#94A3B8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="262" y1="220" x2="350" y2="220" stroke="#94A3B8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="650" y1="72" x2="738" y2="72" stroke="#94A3B8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="650" y1="134" x2="738" y2="134" stroke="#94A3B8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="650" y1="196" x2="738" y2="196" stroke="#94A3B8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="650" y1="258" x2="738" y2="258" stroke="#94A3B8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="150" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7C8599">createMcpServer()</text>
<text x="150" y="310" text-anchor="middle" font-size="12.5" font-weight="500" fill="#7C8599">expose your governed tools</text>
<text x="850" y="330" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7C8599">connectMcpServer()</text>
<text x="850" y="350" text-anchor="middle" font-size="12.5" font-weight="500" fill="#7C8599">import any server as tools</text>
</g>
</svg>
