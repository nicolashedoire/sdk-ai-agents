name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22.x and 24.x also run the SQLite suite on the built-in node:sqlite module, which
        # Node 20 does not have: there the suite is reported as skipped, with the reason.
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run formatter check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Type-check tests
        run: npm run typecheck:tests

      - name: Run tests
        run: npm test

      - name: Generate coverage
        run: npm run test:coverage

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      # Every translation must match the English pages: same files, code, anchors and links.
      - name: Check translations
        run: npm run docs:check
      - name: Build the documentation
        run: npm run docs:build


